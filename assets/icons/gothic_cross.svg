<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <!-- Gothic Crimson Gradient -->
    <linearGradient id="gothGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79"/>
      <stop offset="45%" stop-color="#d11a47"/>
      <stop offset="100%" stop-color="#7a0c25"/>
    </linearGradient>
    <!-- Soft Glow Filter -->
    <filter id="gothGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#ff1a53" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Dark Outer Border Silhouette for contrast on any tab background -->
  <path d="M 16,1
           L 18.5,4 L 17.5,7 L 20,6 L 24,7.5 L 23,10 L 20,10.5 L 20,11
           L 25,9 L 29,11 L 30,14 L 28,15.5 L 25,14 L 20,15 L 20,16
           L 20,24 L 22,25.5 L 20,29 L 16,31 L 12,29 L 10,25.5 L 12,24
           L 12,16 L 12,15 L 7,14 L 4,15.5 L 2,14 L 3,11 L 7,9
           L 12,11 L 12,10.5 L 9,10 L 8,7.5 L 12,6 L 14.5,7 L 13.5,4 Z"
        fill="#0d0205" stroke="#000000" stroke-width="1" stroke-linejoin="round"/>

  <!-- Main Gothic Cross Body with Flory / Trefoil Ends -->
  <!-- Vertical Beam -->
  <path d="M 16,2.5
           C 17,4 17.5,5.5 17,8
           L 17,24
           C 18.5,25 19,26.5 16,29.5
           C 13,26.5 13.5,25 15,24
           L 15,8
           C 14.5,5.5 15,4 16,2.5 Z"
        fill="url(#gothGrad)" filter="url(#gothGlow)"/>

  <!-- Horizontal Beam -->
  <path d="M 4,13.5
           C 6.5,12 8,12.5 10.5,13
           L 21.5,13
           C 24,12.5 25.5,12 28,13.5
           C 25.5,15 24,14.5 21.5,14
           L 10.5,14
           C 8,14.5 6.5,15 4,13.5 Z"
        fill="url(#gothGrad)"/>

  <!-- Flory Tips: Top Arm Trefoil -->
  <circle cx="16" cy="3" r="1.8" fill="#ff6688"/>
  <circle cx="14" cy="4.5" r="1.3" fill="#ff4d79"/>
  <circle cx="18" cy="4.5" r="1.3" fill="#ff4d79"/>

  <!-- Flory Tips: Left Arm Trefoil -->
  <circle cx="3.5" cy="13.5" r="1.6" fill="#ff6688"/>
  <circle cx="5" cy="11.8" r="1.2" fill="#ff4d79"/>
  <circle cx="5" cy="15.2" r="1.2" fill="#ff4d79"/>

  <!-- Flory Tips: Right Arm Trefoil -->
  <circle cx="28.5" cy="13.5" r="1.6" fill="#ff6688"/>
  <circle cx="27" cy="11.8" r="1.2" fill="#ff4d79"/>
  <circle cx="27" cy="15.2" r="1.2" fill="#ff4d79"/>

  <!-- Bottom Spear Tip -->
  <polygon points="16,30.5 14.5,26 17.5,26" fill="#ff3366"/>

  <!-- Central Gothic Diamond / Halo Overlay -->
  <polygon points="16,10.5 19,13.5 16,16.5 13,13.5" fill="#140207" stroke="#ff3366" stroke-width="0.8"/>
  <circle cx="16" cy="13.5" r="1.2" fill="#ffffff"/>

  <!-- Inner Bevel Highlight -->
  <line x1="16" y1="5" x2="16" y2="26" stroke="#ffffff" stroke-width="0.7" opacity="0.6"/>
  <line x1="6" y1="13.5" x2="26" y2="13.5" stroke="#ffffff" stroke-width="0.7" opacity="0.6"/>
</svg>